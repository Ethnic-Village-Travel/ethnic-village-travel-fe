name: Next Deployment

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build Docker image
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$REPO_LOWER/ethnic-village-travel-fe
          echo "Docker image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME:${GITHUB_SHA} .
          docker push $IMAGE_NAME:${GITHUB_SHA}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          debug: true
          script: |
            set -e
            IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/ethnic-village-travel-fe

            # Pull latest image
            docker pull $IMAGE_NAME:${GITHUB_SHA}

            # Stop & remove old container
            docker stop ethnic-village-travel-fe || true
            docker rm ethnic-village-travel-fe || true

            # Run new container
            docker run -d --name ethnic-village-travel-fe \
              -p 3000:3000 \
              --restart unless-stopped \
              $IMAGE_NAME:${GITHUB_SHA}

            echo "Deployment finished!"
