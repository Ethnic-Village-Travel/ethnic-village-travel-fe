name: Next Deployment

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      repo_lower: ${{ steps.set-repo-lower.outputs.repo_lower }}
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compute lowercase repo owner
        id: set-repo-lower
        run: |
          # Convert repository owner to lowercase and expose as step output
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Set image tag (commit SHA)
        id: set-image-tag
        run: |
          echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }} # dùng PAT nếu push vào org

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ needs.build-and-push.outputs.repo_lower }}/ethnic-village-travel-fe
          TAG=${{ steps.set-image-tag.outputs.image_tag }}
          echo "Building and pushing $IMAGE_NAME:$TAG"
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          debug: true
          script_stop: true
          # Truyền IMAGE_NAME và TAG trực tiếp trong script dùng values đã tính ở job trước
          script: |
            set -e
            REPO_LOWER="${{ needs.build-and-push.outputs.repo_lower }}"
            TAG="${{ needs.build-and-push.outputs.image_tag }}"
            IMAGE_NAME="ghcr.io/${REPO_LOWER}/ethnic-village-travel-fe"

            echo "Pulling $IMAGE_NAME:$TAG"
            docker pull $IMAGE_NAME:$TAG

            docker stop ethnic-village-travel-fe || true
            docker rm ethnic-village-travel-fe || true

            docker run -d --name ethnic-village-travel-fe \
              -p 3000:3000 \
              --restart unless-stopped \
              $IMAGE_NAME:$TAG

            echo "Deployment finished!"
